# Generated by nlp-pipeline-agent
# Security scans (Semgrep SAST + Trivy) are included by default.
name: PR Build, Test, and Docker Image
on:
  pull_request: null
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.package }}
      - name: Build
        run: npm install && npm run build
        working-directory: ${{ matrix.package }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        run: docker build -t pr-build-test-and-docker-image:${{ github.sha }} .
        working-directory: ${{ matrix.package }}
    strategy:
      matrix:
        package: &a1
          - bms-backend
          - bms-frontend
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.package }}
      - name: Run tests
        run: npm test
        working-directory: ${{ matrix.package }}
    strategy:
      matrix:
        package: *a1
  sast:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Semgrep SAST scan
        run: semgrep ci
        env:
          SEMGREP_RULES: p/default
  container_scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build image for scan
        run: docker build -t pr-build-test-and-docker-image:scan .
        working-directory: ${{ matrix.package }}
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: pr-build-test-and-docker-image:scan
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
    strategy:
      matrix:
        package: *a1
