# Generated by nlp-pipeline-agent
# Security scans (Semgrep SAST + Trivy) are included by default.
name: CI/CD Pipeline
on:
  pull_request: null
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.package }}
      - name: Build
        run: npm run build --if-present
        working-directory: ${{ matrix.package }}
    strategy:
      matrix:
        package: &a1
          - bms-backend
          - bms-frontend
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.package }}
      - name: Run tests
        run: npm run test --if-present
        working-directory: ${{ matrix.package }}
    strategy:
      matrix:
        package: *a1
  sast:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Semgrep SAST scan
        run: semgrep ci
        env:
          SEMGREP_RULES: p/default
  container_scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: ${{ matrix.package }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
    strategy:
      matrix:
        package: *a1
