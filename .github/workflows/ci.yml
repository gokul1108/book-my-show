# Generated by nlp-pipeline-agent
# Security scans (Semgrep SAST + Trivy) are included by default.
name: CI/CD Pipeline for book-my-show
on:
  push:
    branches: &a1
      - main
  pull_request:
    branches: *a1
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.package }}
      - name: Build
        run: npm install && npm run build
        working-directory: ${{ matrix.package }}
    strategy:
      matrix:
        package: &a2
          - bms-backend
          - bms-frontend
  deploy:
    runs-on: ubuntu-latest
    needs:
      - build
      - sast
      - container_scan
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy to ecs (staging)
        run: |-
          echo "Deploying to ecs / staging"
          # TODO: configure ecs credentials via repository secrets
          # e.g. kubectl set image ... / aws eks update-kubeconfig ...
  sast:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Semgrep SAST scan
        run: semgrep ci
        env:
          SEMGREP_RULES: p/default
  container_scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: ${{ matrix.package }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
    strategy:
      matrix:
        package: *a2
